<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fondo circular con color crema de la marca -->
  <circle cx="100" cy="100" r="100" fill="#F9EDE8"/>
  <!-- Letra D estilizada en color marrón de la marca -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
